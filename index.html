<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ancient Tower Expedition</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff922b'/><text x='50' y='73' font-size='66' text-anchor='middle'>🏯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2350; --ink2:#5a5480; --paper:#fffaf0; --gold:#ffc23d; --gold2:#ff9f1c;
  --t1:#ff6b6b; --t2:#339af0; --t3:#9775fa;
  --ok:#2fb35a; --bad:#f03e3e;
  --floor:#51cf66; --floorDark:#2b8a3e; --floorSoft:#ebfbee;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(180deg,#8fd3ff 0%,#c9ecff 38%,#fff1d6 100%);}
h1,h2,h3,.fred{font-family:'Fredoka','Nunito',sans-serif}
button{font-family:'Fredoka','Nunito',sans-serif;cursor:pointer;border:none}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:drop-shadow(0 6px 0 rgba(120,170,220,.25))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-70%}
.cloud::after{width:40%;height:120%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.spark{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;animation:twinkle 3s infinite ease-in-out;opacity:.7}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.2);opacity:.9}}

#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;}
.logo{display:flex;align-items:center;gap:10px}
.logo .badge{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ffd43b,#ff922b);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 #e8590c}
.logo h1{font-size:clamp(16px,1.6vw,24px);line-height:1;color:#3b2f7a;letter-spacing:.3px}
.logo small{display:block;font-family:'Nunito';font-weight:800;font-size:clamp(10px,.85vw,13px);color:#7a5af8;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.tbtn{background:#fff;color:var(--ink);font-weight:600;font-size:15px;padding:9px 14px;border-radius:14px;box-shadow:0 4px 0 #c7c2e6;display:flex;align-items:center;gap:6px;transition:transform .1s}
.tbtn:hover{transform:translateY(-2px)}
.tbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #c7c2e6}

/* ---------- layout ---------- */
.main{flex:1;display:grid;grid-template-columns:1fr minmax(270px,23vw);gap:16px;padding:0 18px 16px;min-height:0}
.stage{position:relative;min-height:0;border-radius:28px;overflow:hidden}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}

/* ---------- leaderboard ---------- */
.board{background:rgba(255,255,255,.88);border-radius:var(--r);padding:14px;box-shadow:0 6px 0 rgba(90,80,160,.18)}
.board h3{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#3b2f7a}
.board-list{position:relative}
.tcard{position:absolute;left:0;right:0;height:96px;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;
  background:#fff;border:3px solid var(--c);box-shadow:0 5px 0 var(--c);transition:top .6s cubic-bezier(.5,1.6,.4,1),transform .3s}
.tcard.turn{background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--c) 22%,#fff));transform:scale(1.03)}
.tcard.turn::after{content:"YOUR TURN";position:absolute;top:-11px;right:12px;background:var(--c);color:#fff;font-family:Fredoka;font-weight:600;font-size:11px;padding:2px 9px;border-radius:999px;letter-spacing:1px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.tcard .ava{width:54px;height:54px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:32px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.tcard .info{flex:1;min-width:0}
.tcard .nm{font-family:Fredoka;font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .sc{font-family:Fredoka;font-weight:700;font-size:30px;line-height:1;color:var(--c)}
.tcard .rank{position:absolute;top:-10px;left:-8px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--c);display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:14px}
.tcard .pw{font-size:12px;font-weight:800;color:#e8590c}
.tcard .adj{display:flex;flex-direction:column;gap:4px;opacity:.25;transition:opacity .2s}
.tcard:hover .adj{opacity:1}
.tcard .adj button{width:34px;height:24px;border-radius:8px;background:#f1effc;font-weight:700;font-size:12px;color:var(--ink)}
.floatpts{position:absolute;right:60px;top:10px;font-family:Fredoka;font-weight:700;font-size:28px;pointer-events:none;animation:floatUp 1.4s forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
.legend{background:rgba(255,255,255,.88);border-radius:var(--r);padding:12px 14px;font-size:13.5px;line-height:1.45;box-shadow:0 6px 0 rgba(90,80,160,.18)}
.legend b{font-family:Fredoka;font-weight:600}
.legend .row{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.legend .ico{font-size:18px;width:24px;text-align:center}

/* ---------- setup ---------- */
.screen{position:absolute;inset:0;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center}
.panel{background:rgba(255,255,255,.93);border-radius:28px;padding:26px 30px;box-shadow:0 8px 0 rgba(90,80,160,.2);width:min(1000px,100%)}
.hero{text-align:center;margin-bottom:16px}
.hero .big{font-size:clamp(28px,3.4vw,52px);font-family:Fredoka;font-weight:700;line-height:1.05;
  background:linear-gradient(90deg,#7048e8,#e64980,#f76707);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:Fredoka;font-size:clamp(16px,1.6vw,24px);color:#5f3dc4;margin-top:4px}
.story{background:#fff8e1;border:3px dashed #ffc23d;border-radius:18px;padding:12px 18px;font-size:16px;line-height:1.5;margin:12px 0 18px}
.teams-set{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tset{border-radius:20px;padding:14px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.tset input{width:100%;font-family:Fredoka;font-size:18px;font-weight:600;padding:8px 10px;border-radius:12px;border:2px solid #ddd;margin:8px 0;color:var(--ink)}
.emojis{display:flex;flex-wrap:wrap;gap:5px}
.emojis button{width:38px;height:38px;border-radius:10px;background:#fff;font-size:22px;border:2px solid transparent}
.emojis button.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 25%,#fff)}
.opts{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;align-items:flex-start}
.opt{flex:1;min-width:260px}
.opt h4{font-family:Fredoka;font-size:17px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;background:#f1effc;font-weight:800;font-size:13.5px;border:2px solid transparent;font-family:Nunito}
.chip.on{background:#7048e8;color:#fff}
.go{display:block;margin:22px auto 0;font-size:24px;font-weight:700;color:#fff;padding:14px 38px;border-radius:20px;
  background:linear-gradient(135deg,#ff922b,#f03e3e);box-shadow:0 6px 0 #c92a2a;transition:transform .1s}
.go:hover{transform:translateY(-3px) rotate(-1deg)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #c92a2a}
.go.alt{background:linear-gradient(135deg,#4dabf7,#7048e8);box-shadow:0 6px 0 #5f3dc4}

/* ---------- tower map ---------- */
.mapwrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.1fr;gap:10px;padding:14px 18px}
.mapinfo{display:flex;flex-direction:column;justify-content:center;gap:14px}
.mapinfo .panel{padding:20px 24px}
.tower{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;padding-bottom:4px}
.crown{width:46%;height:clamp(54px,9vh,90px);position:relative;display:grid;place-items:center;cursor:pointer;margin-bottom:-2px}
.crown .dome{position:absolute;inset:0;background:linear-gradient(180deg,#ffe066,#fab005);border-radius:50% 50% 8px 8px / 90% 90% 8px 8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.crown .lbl{position:relative;font-family:Fredoka;font-weight:700;font-size:clamp(12px,1.2vw,17px);color:#7a4a00;text-align:center;line-height:1.1}
.crown .flag{position:absolute;top:-34px;left:50%;font-size:30px;transform:translateX(-50%);animation:bob 2s infinite ease-in-out}
.crown.locked{filter:grayscale(.6) brightness(.95)}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.slab{position:relative;height:clamp(46px,8.6vh,82px);border-radius:12px 12px 4px 4px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,var(--fc),color-mix(in srgb,var(--fc) 75%,#000));color:#fff;cursor:pointer;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.08);transition:transform .2s;margin-top:4px}
.slab:hover{transform:scale(1.03)}
.slab .fi{width:clamp(34px,5.6vh,54px);height:clamp(34px,5.6vh,54px);border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:clamp(18px,3vh,30px);flex:none}
.slab .ft{flex:1;min-width:0;line-height:1.1}
.slab .ft b{font-family:Fredoka;font-weight:600;font-size:clamp(12px,1.25vw,18px);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.slab .ft span{font-size:clamp(10px,.9vw,13px);font-weight:800;opacity:.95;text-transform:uppercase;letter-spacing:.6px}
.slab .st{font-size:clamp(18px,2.4vh,26px);background:rgba(255,255,255,.9);border-radius:12px;padding:2px 8px;color:var(--ink);font-family:Fredoka;font-weight:600;white-space:nowrap}
.slab .st small{font-size:12px}
.slab.locked{filter:grayscale(.75) brightness(.85)}
.slab.skipped{opacity:.45;filter:grayscale(1)}
.slab.current{outline:4px solid #fff;outline-offset:2px;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.18)}}
.slab .win{position:absolute;bottom:6px;width:8px;height:12px;border-radius:4px 4px 0 0;background:rgba(0,0,0,.18)}
.ground{width:100%;height:24px;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(#69db7c,#37b24d);margin-top:-2px}
.explorer{position:absolute;font-size:30px;transition:top 1s ease;z-index:3;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}

/* ---------- floor ---------- */
.floorview{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 20px;gap:12px;
  background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--floor) 30%,#fff) 0%,var(--floorSoft) 45%,#fff 100%)}
.floorview::before{content:"";position:absolute;inset:0;opacity:.08;pointer-events:none;
  background-image:radial-gradient(var(--floorDark) 2px,transparent 2px);background-size:26px 26px}
.fhead{display:flex;align-items:center;gap:14px;position:relative}
.fhead .fic{width:64px;height:64px;border-radius:20px;background:var(--floor);display:grid;place-items:center;font-size:38px;box-shadow:0 5px 0 var(--floorDark)}
.fhead h2{font-size:clamp(20px,2.2vw,34px);color:var(--floorDark);line-height:1}
.fhead .tp{font-weight:900;font-size:clamp(12px,1vw,15px);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2)}
.seal{position:relative;font-size:15px;background:#fff;border-radius:14px;padding:8px 14px;border-left:6px solid var(--floor);font-style:italic;color:var(--ink2)}
.progress{display:flex;gap:6px;align-items:center;font-family:Fredoka;font-weight:600;color:var(--floorDark)}
.progress .dots{display:flex;gap:4px}
.progress .dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--floor)}
.progress .dots i.f{background:var(--floor)}
.grid{position:relative;flex:1;display:grid;gap:clamp(10px,1.6vw,22px);align-content:center;justify-content:center;min-height:0}
.grid.g9{grid-template-columns:repeat(3,minmax(0,clamp(110px,15vw,210px)));grid-auto-rows:clamp(80px,17vh,150px)}
.grid.g6{grid-template-columns:repeat(3,minmax(0,clamp(120px,17vw,230px)));grid-auto-rows:clamp(100px,24vh,190px)}
.tile{position:relative;perspective:800px;cursor:pointer}
.tile .inner{position:absolute;inset:0;transition:transform .7s cubic-bezier(.4,1.6,.5,1);transform-style:preserve-3d}
.tile.open .inner{transform:rotateY(180deg)}
.tile .face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:grid;place-items:center}
.tile .front{background:linear-gradient(160deg,#fff 0%,color-mix(in srgb,var(--floor) 35%,#fff) 100%);border:4px solid var(--floor);box-shadow:0 8px 0 var(--floorDark)}
.tile .front .num{width:clamp(50px,7vh,74px);height:clamp(50px,7vh,74px);border-radius:50%;background:#fff;border:4px dashed var(--floorDark);display:grid;place-items:center;
  font-family:Fredoka;font-weight:700;font-size:clamp(26px,4vh,40px);color:var(--floorDark)}
.tile .front .rune{position:absolute;top:8px;right:12px;font-size:18px;opacity:.6}
.tile:not(.open):hover .inner{transform:translateY(-6px) rotate(-2deg)}
.tile:not(.open):hover .front{box-shadow:0 14px 0 var(--floorDark)}
.tile .back{transform:rotateY(180deg);background:#fff;border:4px solid #ddd;flex-direction:column;text-align:center;font-family:Fredoka;font-weight:600}
.tile .back .bi{font-size:clamp(28px,5vh,46px);line-height:1}
.tile .back .bt{font-size:clamp(11px,1vw,15px);margin-top:4px;color:var(--ink2);padding:0 6px}
.tile.open{cursor:default}
.tile.r-ok .back{border-color:var(--ok);background:#ebfbee}
.tile.r-bad .back{border-color:var(--bad);background:#fff5f5}
.tile.r-tre .back{border-color:#fab005;background:#fff9db}
.tile.r-ch .back{border-color:#7048e8;background:#f3f0ff}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,35,80,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.card{position:relative;width:min(1180px,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:30px;padding:26px 32px 24px;box-shadow:0 12px 0 rgba(0,0,0,.18);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:Fredoka;font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px;color:#fff;background:var(--pc,#7048e8);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.qteam{font-family:Fredoka;font-weight:600;font-size:17px;display:inline-flex;vertical-align:middle;align-items:center;gap:6px}
.qteam .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.qtext{font-family:Fredoka;font-weight:500;font-size:clamp(22px,2.5vw,38px);line-height:1.3;margin:20px 0 22px;color:var(--ink)}
.blank{display:inline-block;min-width:150px;border-bottom:4px dashed #7048e8;text-align:center;color:#7048e8;font-weight:700;padding:0 6px;line-height:1.1}
.blank.filled{border-bottom-style:solid;background:#e5dbff;border-radius:8px 8px 0 0;animation:pop .5s}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.optgrid.tf{grid-template-columns:1fr 1fr}
.ob{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:20px;color:#fff;font-family:Fredoka;font-weight:600;font-size:clamp(17px,1.7vw,26px);
  background:var(--oc);box-shadow:0 6px 0 color-mix(in srgb,var(--oc) 70%,#000);transition:transform .12s,opacity .3s,filter .3s;min-height:76px}
.ob:hover:not(:disabled){transform:translateY(-3px)}
.ob .sh{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:22px;flex:none}
.ob.dim{opacity:.35;filter:grayscale(.6)}
.ob.right{outline:6px solid var(--ok);outline-offset:3px;animation:bounce .6s}
.ob.wrong{outline:6px solid var(--bad);outline-offset:3px;animation:shake .5s}
.ob .mk{position:absolute;right:14px;font-size:34px}
.ob:disabled{cursor:default}
@keyframes bounce{30%{transform:scale(1.06)}60%{transform:scale(.98)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.answerbox{margin-top:18px;border-radius:20px;padding:14px 18px;background:#f3f0ff;border:3px solid #b197fc;animation:pop .4s}
.answerbox .al{font-family:Fredoka;font-weight:700;font-size:clamp(20px,2vw,30px);color:#5f3dc4}
.answerbox .ex{font-size:clamp(15px,1.2vw,18px);margin-top:4px;color:var(--ink2)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{font-weight:600;font-size:18px;padding:11px 20px;border-radius:16px;color:#fff;background:var(--bc,#7048e8);box-shadow:0 5px 0 color-mix(in srgb,var(--bc,#7048e8) 65%,#000);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--bc,#7048e8) 65%,#000)}
.btn.ghost{background:#f1effc;color:var(--ink);box-shadow:0 5px 0 #c7c2e6}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.judge{margin-top:16px;padding:14px 16px;border-radius:20px;background:#fff9db;border:3px dashed #fab005}
.judge h4{font-family:Fredoka;font-size:21px;margin-bottom:10px}
.judge .row{display:flex;gap:10px;flex-wrap:wrap}
.timer{position:absolute;top:18px;right:24px;width:96px;height:96px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tn{position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:36px}
.timer.warn .tn{color:var(--bad);animation:pulse .5s infinite}
.timesup{font-family:Fredoka;font-weight:700;color:var(--bad);font-size:22px;animation:shake .5s}

/* treasure & challenge */
.special{text-align:center}
.special .big{font-size:clamp(70px,12vh,120px);line-height:1;animation:wiggle 1.2s infinite}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.special h2{font-size:clamp(28px,3vw,44px);margin:8px 0}
.reel{margin:18px auto;width:min(620px,90%);height:120px;border-radius:24px;background:linear-gradient(135deg,#fff3bf,#ffe066);border:5px solid #fab005;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.reel .ri{font-family:Fredoka;font-weight:700;font-size:clamp(22px,2.4vw,34px);color:#7a4a00;display:flex;align-items:center;gap:14px}
.reel .ri span{font-size:52px}
.reel.done{animation:bounce .6s;border-color:#f08c00}
.chtext{font-family:Fredoka;font-weight:500;font-size:clamp(20px,2.2vw,32px);line-height:1.35;background:#f3f0ff;border-radius:22px;padding:18px 22px;margin:14px auto;max-width:900px;border:3px solid #b197fc}
.steal{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tbtn2{padding:12px 18px;border-radius:16px;color:#fff;font-weight:600;font-size:19px;background:var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000);display:flex;gap:8px;align-items:center}

/* cleared / final / victory */
.door{width:220px;height:260px;margin:10px auto;position:relative;perspective:600px}
.door .fr{position:absolute;inset:0;border-radius:110px 110px 10px 10px;background:#2b2350;overflow:hidden;display:grid;place-items:center;font-size:80px}
.door .lf,.door .rt{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#8d5524,#b07d4b);border:4px solid #5c3a1a;transition:transform 1.6s ease .4s}
.door .lf{left:0;border-radius:110px 0 0 10px;transform-origin:left}
.door .rt{right:0;border-radius:0 110px 10px 0;transform-origin:right}
.door.open .lf{transform:rotateY(-105deg)}

function newState(teams,opts){

    tiles:opts.tiles, timer:opts.timer, floors:opts.floors, turn:0, cur:null, view:"map", fs:{}, finalDone:false, unlockAll:false};

/* ---------- timer ---------- */
let TM=null;
function startTimer(sec,onEnd){
  stopTimer();
  const box=$("#modal .timer"); if(!box) return;
  const circ=2*Math.PI*42; const ring=box.querySelector(".fg"); const num=box.querySelector(".tn");
  let left=sec, total=sec, running=true, last=performance.now(), acc=0;
  const draw=()=>{num.textContent=Math.ceil(left);ring.style.strokeDashoffset=circ*(1-left/total);box.classList.toggle("warn",left<=5);ring.style.stroke=left<=5?"#f03e3e":left<=total/2?"#fab005":"#40c057"};
  draw();
  TM={pause(){running=false},play(){running=true;last=performance.now()},add(s){left+=s;total=Math.max(total,left);draw()},get running(){return running},get left(){return left},stop(){running=false;cancelAnimationFrame(TM&&TM.raf)}};
  let lastSec=Math.ceil(left);
  const loop=now=>{
    if(!TM) return;
    const dt=(now-last)/1000; last=now;
    if(running){left=Math.max(0,left-dt);draw(); const cs=Math.ceil(left); if(cs!==lastSec){lastSec=cs; if(cs<=5&&cs>0)SFX.tick()} if(left<=0){running=false;SFX.buzz();onEnd&&onEnd();return}}
    TM.raf=requestAnimationFrame(loop);
  };
  TM.raf=requestAnimationFrame(loop);
}
function stopTimer(){ if(TM){cancelAnimationFrame(TM.raf);TM=null} }

  let body="";
  const qtext=q.t==="fill"?esc(q.q).replace("___",'<span class="blank" id="blank">?</span>'):esc(q.q);
  if(q.t==="mcq") body=`<div class="optgrid">${q.o.map((o,k)=>`<button class="ob" data-k="${k}" style="--oc:${OPT_COL[k]}"><span class="sh">${OPT_SH[k]}</span><span>${String.fromCharCode(65+k)}. ${esc(o)}</span></button>`).join("")}</div>`;
  if(q.t==="tf") body=`<div class="optgrid tf"><button class="ob" data-k="1" style="--oc:#40c057"><span class="sh">👍</span><span>TRUE</span></button><button class="ob" data-k="0" style="--oc:#ff6b6b"><span class="sh">👎</span><span>FALSE</span></button></div>`;
  const auto=(q.t==="mcq"||q.t==="tf");
  openModal(`${timerHTML}
    <div class="qtop"><span class="pill" style="--pc:${col}">${lab}</span><span class="pill" style="--pc:${f.d}">${f.icon} Floor ${f.n}</span>${teamTag(at)}${S.teams[at].double?'<span class="pill" style="--pc:#f08c00">✨ ×2</span>':""}</div>
    <div class="qtext" style="padding-right:100px">${qtext}</div>
    ${body}
    <div id="ansHost"></div>
    <div class="ctrl" id="ctrl">
      <button class="btn ghost" id="bPause">⏸ Pause</button>
      <button class="btn ghost" id="bAdd">+10 s</button>
      <span id="tu"></span><div class="spacer" style="flex:1"></div>
      <button class="btn" id="bReveal" style="--bc:#7048e8">👁 Reveal answer</button>
    </div>
    <div id="judgeHost"></div>`);
  $("#modal .tn").textContent=S.timer;
  let locked=false, picked=null;
  const reveal=()=>{
    if(locked) return; locked=true; stopTimer();
    $("#bReveal").disabled=true; $("#bPause").disabled=true; $("#bAdd").disabled=true;
    const ansText = q.t==="tf"?(q.a?"TRUE":"FALSE"): q.t==="mcq"?`${String.fromCharCode(65+q.a)}. ${q.o[q.a]}`:q.a;
    if(q.t==="fill"){const b=$("#blank");b.textContent=q.a;b.classList.add("filled")}
    $("#ansHost").innerHTML=`<div class="answerbox"><div class="al">✅ Answer: ${esc(ansText)}</div><div class="ex">💡 ${esc(q.x)}</div></div>`;
    if(auto){
      const correctK = q.t==="tf"?(q.a?1:0):q.a;
      document.querySelectorAll("#modal .ob").forEach(b=>{b.disabled=true;const k=+b.dataset.k;
        if(k===correctK){b.classList.add("right");b.insertAdjacentHTML("beforeend",'<span class="mk">✔</span>')}
        else if(k===picked){b.classList.add("wrong");b.insertAdjacentHTML("beforeend",'<span class="mk">✖</span>')}
        else b.classList.add("dim")});
      if(picked!==null){ picked===correctK?activeRight():activeWrong(); }
      else judgeButtons();
    } else judgeButtons();
  };
  const judgeButtons=()=>{
    $("#judgeHost").innerHTML=`<div class="judge"><h4>Did ${esc(S.teams[at].name)} answer correctly?</h4><div class="row">
      <button class="btn" style="--bc:#2fb35a" id="jY">✔ Correct</button><button class="btn" style="--bc:#f03e3e" id="jN">✖ Wrong / no answer</button></div></div>`;
    $("#jY").onclick=activeRight; $("#jN").onclick=activeWrong;
  };
  const activeRight=()=>{
    SFX.ok(); burst(60);
    const mult=S.teams[at].double?2:1; S.teams[at].double=false;
    addPoints(at,PTS.q*mult);
    $("#judgeHost").innerHTML=`<div class="judge" style="background:#ebfbee;border-color:#2fb35a"><h4>🎉 Brilliant! ${esc(S.teams[at].name)} earns +${PTS.q*mult} points${mult>1?" (Double Rune!)":""}</h4>
      <div class="row"><button class="btn" style="--bc:#2fb35a" id="jC">Continue ➜</button></div></div>`;
    $("#jC").onclick=()=>finishTile(ti,"ok",S.teams[at].name);
  };
  const activeWrong=()=>{
    SFX.bad(); S.teams[at].double=false; renderBoard();
    const others=[0,1,2].filter(x=>x!==at);
    $("#judgeHost").innerHTML=`<div class="judge"><h4>🦹 STEAL CHANCE! Other teams – hands up! Who can answer correctly? (+${PTS.steal})</h4>
      <div class="row steal">${others.map(o=>`<button class="tbtn2" data-o="${o}" style="--c:${S.teams[o].color}">${S.teams[o].emoji} ${esc(S.teams[o].name)}</button>`).join("")}
      <button class="btn ghost" id="jNone">Nobody</button></div></div>`;
    document.querySelectorAll("#judgeHost .tbtn2").forEach(b=>b.onclick=()=>{const o=+b.dataset.o;SFX.ok();burst(30);addPoints(o,PTS.steal);setTimeout(()=>finishTile(ti,"steal",S.teams[o].name),700)});
    $("#jNone").onclick=()=>finishTile(ti,"bad","");
  };
  document.querySelectorAll("#modal .ob").forEach(b=>b.onclick=()=>{ if(locked) return; picked=+b.dataset.k; SFX.click(); reveal(); });
  $("#bReveal").onclick=reveal;
  $("#bPause").onclick=()=>{ if(!TM) return; if(TM.running){TM.pause();$("#bPause").textContent="▶ Resume"} else {TM.play();$("#bPause").textContent="⏸ Pause"} };
  $("#bAdd").onclick=()=>{ if(TM){TM.add(10);if(!TM.running){TM.play();$("#bPause").textContent="⏸ Pause"}} };
  setTimeout(()=>{ if(!locked) startTimer(S.timer,()=>{ $("#tu").innerHTML='<span class="timesup">⏰ TIME\'S UP!</span>'; }) },400);
  keyHandler=e=>{ if(e.code==="Space"){e.preventDefault();$("#bPause").click()} if(e.key==="r"||e.key==="R") reveal(); if(!locked&&auto&&["1","2","3","4"].includes(e.key)){const bs=document.querySelectorAll("#modal .ob");const b=bs[+e.key-1];b&&b.click()} };
}
let keyHandler=null;
document.addEventListener("keydown",e=>{ if(keyHandler&&$("#modal .card")) keyHandler(e) });

/* ---------- treasure ---------- */
function showTreasure(ti){
  const at=S.turn;
  openModal(`<div class="special"><div class="big">💰</div><h2 class="fred" style="color:#e67700">TREASURE CHEST!</h2>
    <div style="font-size:20px">${teamTag(at)} found a hidden chest. Spin to reveal your reward!</div>
    <div class="reel" id="reel"><div class="ri">❔ <span style="font-size:22px">Ready…</span></div></div>
    <div class="ctrl" style="justify-content:center"><button class="btn" style="--bc:#f08c00" id="spin">🎰 SPIN!</button></div></div>`);
  const reel=$("#reel");
  $("#spin").onclick=()=>{
    $("#spin").disabled=true;
    const pick=TREASURES[Math.floor(Math.random()*TREASURES.length)];
    let n=0, delay=60;
    const step=()=>{
      const t=TREASURES[n%TREASURES.length]; n++;
      reel.innerHTML=`<div class="ri"><span>${t.icon}</span>${t.name}</div>`; SFX.roll();
      if(n<18||TREASURES[(n-1)%TREASURES.length]!==pick){delay*=1.12;setTimeout(step,delay)}
      else{
        reel.classList.add("done"); SFX.tre(); burst(80,true);
        reel.innerHTML=`<div class="ri"><span>${pick.icon}</span><div style="text-align:left">${pick.name}<div style="font-size:18px;font-weight:500">${pick.desc}</div></div></div>`;
        let label=pick.name, extra=false;
        if(pick.id==="gold") addPoints(at,150);
        if(pick.id==="double"){S.teams[at].double=true;renderBoard();save()}
        if(pick.id==="extra"){addPoints(at,50);extra=true}
        if(pick.id==="thief"){
          const others=[0,1,2].filter(x=>x!==at).sort((a,b)=>S.teams[b].score-S.teams[a].score);
          const v=others[0]; const took=-addPoints(v,-100); addPoints(at,took);
          reel.insertAdjacentHTML("afterend",`<div style="font-size:18px;margin-top:-6px">🗝️ Took <b>${took}</b> points from ${esc(S.teams[v].name)}!</div>`);
          label=`Stole ${took} pts`;
        }
        $("#modal .ctrl").innerHTML=`<button class="btn" style="--bc:#2fb35a" id="claim">${extra?"⏳ Pick another stone ➜":"Claim & continue ➜"}</button>`;
        $("#claim").onclick=()=>finishTile(ti,"tre",`${S.teams[at].emoji} ${label}`,extra);
      }
    };
    step();
  };
}

/* ---------- challenge / trap ---------- */
function showChallenge(ti){
  const at=S.turn; const tile=S.fs[S.cur].tiles[ti];
  if(tile.trap){
    SFX.trap(); document.body.animate([{transform:"translateX(0)"},{transform:"translateX(-12px)"},{transform:"translateX(12px)"},{transform:"translateX(0)"}],{duration:400,iterations:2});
    openModal(`<div class="special"><div class="big">💥</div><h2 class="fred" style="color:#c92a2a">TRAP! The floor is crumbling!</h2>
      <div style="font-size:22px;margin:10px 0">${teamTag(at)} stepped on a cursed stone and loses <b>${PTS.trap}</b> points.</div>
      <div class="ctrl" style="justify-content:center"><button class="btn" style="--bc:#f03e3e" id="ok">Ouch! Continue ➜</button></div></div>`);
    addPoints(at,-PTS.trap);
    $("#ok").onclick=()=>finishTile(ti,"ch",`${S.teams[at].emoji} Trap −${PTS.trap}`);
    return;
  }
  const txt=CHALLENGES[S.cur][tile.i];
  openModal(`${timerHTML}<div class="special"><div class="big">⚡</div><h2 class="fred" style="color:#5f3dc4">CHALLENGE STONE!</h2>
    <div style="font-size:20px">${teamTag(at)} must complete this task:</div>
    <div class="chtext">${esc(txt)}</div>
    <div style="font-size:16px;color:#5a5480">Success: <b style="color:#2fb35a">+${PTS.chWin}</b> · Fail: <b style="color:#f03e3e">−${PTS.chLose}</b> · Teacher decides!</div>
    <div class="ctrl" style="justify-content:center">
      <button class="btn ghost" id="bPause">⏸ Pause</button><span id="tu"></span>
      <button class="btn" style="--bc:#2fb35a" id="win">✔ Success!</button><button class="btn" style="--bc:#f03e3e" id="lose">✖ Failed</button></div></div>`);
  $("#modal .tn").textContent=S.timer;
  $("#bPause").onclick=()=>{ if(!TM) return; if(TM.running){TM.pause();$("#bPause").textContent="▶ Resume"} else {TM.play();$("#bPause").textContent="⏸ Pause"} };
  setTimeout(()=>startTimer(S.timer,()=>{$("#tu").innerHTML='<span class="timesup">⏰ TIME\'S UP!</span>'}),400);
  $("#win").onclick=()=>{SFX.ok();burst(60);addPoints(at,PTS.chWin);setTimeout(()=>finishTile(ti,"ch",`${S.teams[at].emoji} +${PTS.chWin}`),600)};
  $("#lose").onclick=()=>{SFX.bad();addPoints(at,-PTS.chLose);setTimeout(()=>finishTile(ti,"ch",`${S.teams[at].emoji} −${PTS.chLose}`),600)};
  keyHandler=e=>{ if(e.code==="Space"){e.preventDefault();$("#bPause").click()} };
}

/* ---------- floor cleared ---------- */
function showCleared(n){
  const f=floorById(n); const nf=nextFloor();
  openModal(`<div class="special"><h2 class="fred" style="color:${f.d}">🎊 SEAL BROKEN! 🎊</h2>
    <div style="font-size:20px">${f.icon} <b>${f.name}</b> has been conquered!</div>
    <div class="door" id="door"><div class="fr">${nf?nf.icon:"👑"}</div><div class="lf"></div><div class="rt"></div></div>
    <div style="font-size:19px">${nf?`The door to <b>Floor ${nf.n}: ${nf.name}</b> creaks open…`:"The path to the <b>👑 Crown Chamber</b> is open!"}</div>
    <div class="ctrl" style="justify-content:center"><button class="btn" style="--bc:${f.d}" id="up">🧗 Climb the tower ➜</button></div></div>`);
  SFX.door(); setTimeout(()=>{$("#door")&&$("#door").classList.add("open");burst(120,true)},300);
  $("#up").onclick=()=>{closeModal();renderMap()};
}

/* ---------- final ---------- */
function showFinal(){
  if(S.finalDone){showVictory();return}
  const fq=FINAL_Q[Math.floor(Math.random()*FINAL_Q.length)];
  const wager=S.teams.map(t=>Math.min(100,t.score)); const judged=[null,null,null];
  setFloorTheme({c:"#fab005",d:"#e67700",s:"#fff9db"});
  const draw=(phase)=>{
    const card=openModal(`${phase==="q"?timerHTML:""}<div class="special">
      <div class="big" style="animation:none">👑</div><h2 class="fred" style="color:#e67700">THE GUARDIAN'S RIDDLE</h2>
      ${phase==="w"?`<div style="font-size:19px;max-width:820px;margin:0 auto">The Tower Guardian asks ONE final riddle. Each team secretly decides how many points to <b>wager</b> (up to 300). Answer correctly: <b style="color:#2fb35a">win</b> your wager. Wrong: <b style="color:#f03e3e">lose</b> it!</div>`
       :`<div class="chtext" style="text-align:left">${esc(fq.q)}</div>`}
      ${phase==="a"?`<div class="answerbox" style="text-align:left"><div class="al">✅ ${esc(fq.a)}</div></div>`:""}
      <div class="wager">${S.teams.map((t,i)=>`<div class="wcard" style="--c:${t.color}"><div class="fred" style="font-weight:600;font-size:18px">${t.emoji} ${esc(t.name)}</div>
        <div style="font-size:13px;color:#5a5480">Wager (score ${t.score})</div><div class="wv">${wager[i]}</div>
        ${phase==="w"?`<div class="wb"><button data-i="${i}" data-d="-50">−</button><button data-i="${i}" data-d="50">+</button></div>`:""}
        ${phase==="a"?`<div class="judge2"><button class="y ${judged[i]===true?"on":""}" data-i="${i}" data-v="1">✔ Right</button><button class="n ${judged[i]===false?"on":""}" data-i="${i}" data-v="0">✖ Wrong</button></div>`:""}
      </div>`).join("")}</div>
      <div class="ctrl" style="justify-content:center">
        ${phase==="w"?`<button class="btn ghost" id="back">← Back to tower</button><button class="btn" style="--bc:#e67700" id="lock">🔒 Lock wagers & show riddle</button>`:""}
        ${phase==="q"?`<button class="btn ghost" id="bPause">⏸ Pause</button><span id="tu"></span><button class="btn" style="--bc:#7048e8" id="rev">👁 Reveal answer</button>`:""}
        ${phase==="a"?`<button class="btn" style="--bc:#2fb35a" id="apply" ${judged.includes(null)?"disabled":""}>🏆 Crown the champion!</button>`:""}
      </div></div>`);
    if(phase==="w"){
      card.querySelectorAll(".wb button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const max=Math.min(300,S.teams[i].score);wager[i]=Math.max(0,Math.min(max,wager[i]+ +b.dataset.d));SFX.click();draw("w")});
      $("#lock").onclick=()=>{SFX.door();draw("q")};
      $("#back").onclick=()=>{closeModal();renderMap()};
    }
    if(phase==="q"){
      $("#modal .tn").textContent=60;
      setTimeout(()=>$("#rev")&&startTimer(60,()=>{$("#tu").innerHTML='<span class="timesup">⏰ TIME\'S UP!</span>'}),400);
      $("#bPause").onclick=()=>{ if(!TM) return; if(TM.running){TM.pause();$("#bPause").textContent="▶ Resume"} else {TM.play();$("#bPause").textContent="⏸ Pause"} };
      $("#rev").onclick=()=>{stopTimer();SFX.flip();draw("a")};
    }
    if(phase==="a"){
      card.querySelectorAll(".judge2 button").forEach(b=>b.onclick=()=>{judged[+b.dataset.i]=b.dataset.v==="1";SFX.click();draw("a")});
      $("#apply").onclick=()=>{S.teams.forEach((t,i)=>{if(wager[i])addPoints(i,judged[i]?wager[i]:-wager[i])});S.finalDone=true;save();closeModal();setTimeout(showVictory,900)};
    }
  };
  draw("w");
}

function showVictory(){
  S.view="victory"; save(); renderBoard();
  const order=S.teams.map((t,i)=>i).sort((a,b)=>S.teams[b].score-S.teams[a].score);
  const pos=[order[1],order[0],order[2]]; const hs=[150,210,110]; const lbl=["2","1","3"];
  const top=S.teams[order[0]]; const tie=S.teams[order[1]].score===top.score;
  $("#stage").innerHTML=`<div class="screen" style="justify-content:center"><div class="panel" style="text-align:center">
    <div class="hero"><div class="big">${tie?"🤝 It's a tie at the top!":"👑 "+esc(top.name)+" wins!"}</div>
    <div class="sub">${tie?"Two teams share the crown of Master Explorer!":"Crowned MASTER EXPLORERS of the Ancient Tower"}</div></div>
    <div class="podium">${pos.map((ti,k)=>{const t=S.teams[ti];return `<div class="pcol"><div class="pa">${k===1?"👑":""}${t.emoji}</div><div class="pn">${esc(t.name)}</div><div class="ps" style="color:${t.color}">${t.score}</div>
      <div class="blk" style="height:${hs[k]}px;background:${t.color}">${lbl[k]}</div></div>`}).join("")}</div>
    <div style="font-size:17px;margin-top:16px;color:#5a5480">You have decoded the Origin of Scientific Life – from nutrients and body systems to atoms, mixtures, metals and energy changes. Well done, scientists! 🔬</div>
    <button class="go" id="again">🔄 New expedition</button></div></div>`;
  SFX.win(); burst(220,true); setTimeout(()=>burst(160,true),900); setTimeout(()=>burst(160,true),1800);
  $("#again").onclick=()=>{try{localStorage.removeItem("towerExpedition")}catch(e){} renderSetup()};
}

/* =========================================================
   CONFETTI
   ========================================================= */
const cv=$("#confetti"), cx=cv.getContext("2d"); let parts=[], animOn=false;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight} sizeCv(); addEventListener("resize",sizeCv);
function burst(n=80,wide){
  const cols=["#ff6b6b","#ffd43b","#51cf66","#339af0","#9775fa","#f06595","#ff922b"];
  for(let i=0;i<n;i++) parts.push({x:wide?Math.random()*cv.width:cv.width/2+(Math.random()-.5)*200,y:wide?-20:cv.height*.45,vx:(Math.random()-.5)*(wide?4:16),vy:wide?Math.random()*3+2:-Math.random()*14-4,
    r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:0,shape:Math.random()<.3?"c":"r"});
  if(!animOn){animOn=true;requestAnimationFrame(frame)}
}
function frame(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.vx*=.99;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
    if(p.shape==="c"){cx.beginPath();cx.arc(0,0,p.r/1.5,0,7);cx.fill()} else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+40&&p.life<400);
  if(parts.length) requestAnimationFrame(frame); else {animOn=false;cx.clearRect(0,0,cv.width,cv.height)}
}

   SKY + TOP BAR

(function sky(){
  const s=$("#sky"); let h="";
  for(let i=0;i<6;i++){const w=90+Math.random()*120;h+=`<div class="cloud" style="width:${w}px;height:${w*.32}px;top:${4+Math.random()*55}%;animation:drift ${60+Math.random()*60}s linear ${-Math.random()*90}s infinite"></div>`}
  for(let i=0;i<22;i++)h+=`<div class="spark" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></div>`;
  s.innerHTML=h;
})();
$("#bSound").onclick=()=>{sound=!sound;$("#bSound").textContent=sound?"🔊":"🔇";if(sound)SFX.click()};
$("#bFull").onclick=()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>toast("Full screen is not available here"));else document.exitFullscreen()}catch(e){toast("Full screen is not available here")}};
$("#bMap").onclick=()=>{ if(!S){toast("Set up your teams first!");return} if(S.view==="victory"){showVictory();return} closeModal(); SFX.click(); renderMap() };
$("#bMenu").onclick=()=>{
  const h=$("#menuHost"); if(h.innerHTML){h.innerHTML="";return}
  h.innerHTML=`<div class="menu">
    <button id="mTurn">🔁 Change whose turn it is</button>
    <button id="mUnlock">🔓 Unlock all floors (teacher)</button>
    <button id="mFinal">👑 Jump to the Crown Chamber</button>
    <button id="mNew">🆕 New game / setup</button>
    <div style="padding:8px 12px;font-size:12.5px;color:#5a5480;line-height:1.5">Shortcuts in a question:<br><span class="kbd">Space</span> pause · <span class="kbd">R</span> reveal · <span class="kbd">1–4</span> choose option</div></div>`;
  const close=()=>h.innerHTML="";
  $("#mTurn").onclick=()=>{close();if(!S)return;S.turn=(S.turn+1)%3;save();renderBoard();toast(`It's now ${S.teams[S.turn].name}'s turn`)};
  $("#mUnlock").onclick=()=>{close();if(!S)return;S.unlockAll=true;save();toast("🔓 All floors unlocked");if(S.view==="map")renderMap()};
  $("#mFinal").onclick=()=>{close();if(!S)return;showFinal()};
  $("#mNew").onclick=()=>{close();closeModal();renderSetup()};
};
document.addEventListener("click",e=>{ if(!e.target.closest("#bMenu")&&!e.target.closest(".menu")) $("#menuHost").innerHTML="" });

renderSetup();
